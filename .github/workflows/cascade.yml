name: cascade-enhance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: require README and SECURITY
        run: test -f README.md && test -f SECURITY.md
      - name: stamp present
        run: test -f docs/LEDGER-STAMP.md || echo "stamp pending"
      - name: refuse empty numeral mention in README
        run: grep -q "137451921129154222" README.md
