name: cascade-hourly
on:
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [continuity-cascade, pull-then-push]
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: env-check
        run: |
          mkdir -p docs scripts
          chmod +x scripts/env-check.sh || true
          if [ -f scripts/env-check.sh ]; then bash scripts/env-check.sh; fi
          test -f README.md
      - name: stamp
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          HASH=$(printf '%s' "$TS-137451921129154222-hive-124" | sha256sum | awk '{print $1}')
          mkdir -p docs
          {
            echo "# LEDGER-STAMP"
            echo "- utc: $TS"
            echo "- numeral: 137451921129154222"
            echo "- surface: The-Hive"
            echo "- team: enhance"
            echo "- stage: 124-ack"
            echo "- next: continuity-ledger-cycle"
            echo "- sha256: \`$HASH\`"
          } > docs/LEDGER-STAMP.md
          git config user.name "continuity-engine"
          git config user.email "continuity@local"
          git add docs/LEDGER-STAMP.md
          git diff --cached --quiet || git commit -m "hive: team-enhance stamp (137451921129154222)"
          git push || true
