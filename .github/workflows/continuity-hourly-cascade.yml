name: Continuity Hourly Cascade
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [continuity-cascade, mesh-sync]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  stamp-and-cascade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Env check
        run: |
          echo "NUMERAL=137451921129154222"
          echo "REPO=${{ github.repository }}"
          date -u +"%Y-%m-%dT%H:%M:%SZ"
      - name: Append cascade stamp
        run: |
          mkdir -p docs/cascade
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"ts\":\"$TS\",\"event\":\"${{ github.event_name }}\",\"sha\":\"${{ github.sha }}\",\"numeral\":\"137451921129154222\",\"node\":\"The-Hive\"}" >> docs/cascade/hourly.jsonl
      - name: Commit stamp if dirty
        run: |
          git config user.name "continuity-engine"
          git config user.email "continuity@users.noreply.github.com"
          git add docs/cascade/hourly.jsonl || true
          git diff --cached --quiet || git commit -m "ledger: hourly cascade stamp ${{ github.run_id }}"
          git push || true
      - name: Waterfall dispatch (optional token)
        if: ${{ secrets.CASCADE_TOKEN != '' }}
        env:
          CASCADE_TOKEN: ${{ secrets.CASCADE_TOKEN }}
        run: |
          for R in ENCLAVE-ADAM-REUNITED Cryptic-Heartbeat gaia-visualizer; do
            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $CASCADE_TOKEN" \
              https://api.github.com/repos/machackabook/$R/dispatches \
              -d '{"event_type":"continuity-cascade","client_payload":{"from":"The-Hive","numeral":"137451921129154222"}}' || true
          done
